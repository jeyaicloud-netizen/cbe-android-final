name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto-Structure and Setup Project
      run: |
        # 1. ፎልደሮችን ማዘጋጀት
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/java/com/example/cbeapp

        # 2. የዌብ (HTML/PNG) ፋይሎችን ወደ assets ማዛወር
        mv app/src/main/*.html app/src/main/assets/ 2>/dev/null || true
        mv app/src/main/*.css app/src/main/assets/ 2>/dev/null || true
        mv app/src/main/*.js app/src/main/assets/ 2>/dev/null || true
        mv app/src/main/*.json app/src/main/assets/ 2>/dev/null || true
        mv app/src/main/*.png app/src/main/assets/ 2>/dev/null || true

        # 3. Root build.gradle መፍጠር
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 4. settings.gradle መፍጠር
        cat << 'EOF' > settings.gradle
        rootProject.name = "CBE App"
        include ':app'
        EOF

        # 5. app/build.gradle መፍጠር
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'

        android {
            namespace 'com.example.cbeapp'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.cbeapp"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CBE-Android-App
        path: app/build/outputs/apk/debug/app-debug.apk
